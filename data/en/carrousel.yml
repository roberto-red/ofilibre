enable    : true
topTitle  : News from OfiLibre
title     : Open calls and useful links
item  :
  - icon  : tf-ion-ios-calendar-outline
    title : Free Culture Days
    link  : /acciones/jornadas
    description : >
      Explore the full content of the 4th Free Culture Days, including video recordings of presentations and all related materials. Talks, workshops, and sessions on open access, education, citizen science, and innovation, among others. Don’t miss any details!

  - icon  : tf-ion-ios-paper
    title : Open Subjects Call 2025–2026
    link  : /guias/convocatoria-asignaturas-abierto/
    description : >
      Check the details of the call for recognition of open access publication of teaching materials for the 2025–2026 academic year.

  - icon  : tf-ion-coffee
    title : Cafe con OfiLibre
    link  : /acciones/cafes
    description : >
      Every teaching Wednesday at 10:00 AM, join us for 15 minutes at Cafe con OfiLibre via streaming. A relaxed moment to chat about the topics we care about. We cover a different topic each session — just connect and listen, or participate if you feel like it. You can also watch past session recordings.

  - icon  : tf-ion-ios-book-outline
    title : Open Access Academic Journals at URJC
    link  : https://revistas.urjc.es/
    description : >
      Platform of open access academic journals published by URJC. All these journals follow the diamond open access model.
