title     : Líneas de actuación
tabItem   :
  - id        : publicacionAbierta
    title     : Publicación abierta
    content   : >
      Entendemos la publicación abierta (open access) tal y como se define en la Declaración de Berlín, y como tal la explicamos a la comunidad universitaria, como pilar fundamental de la divulgación de los resultados de la investigación. Además, creemos que la misma idea puede extenderse también a muchos materiales de apoyo de aprendizaje y, en general, en muchos casos, a los documentos, audios, vídeos, multimedia, etc. producidos como parte de las actividades docentes, investigadoras o de gestión realizadas en la Universidad. <br><br>
      Los objetivos principales de esta línea son: <br><br>
      - Promover la publicación abierta de los materiales que produce institucionalmente la Universidad. <br>
      - Facilitar el proceso de publicación abierta para aquellos que ya lo están practicando, tanto en su vertiente docente como en la de investigación. <br>
      - Formar al personal de la Universidad interesado en el conocimiento libre, tanto en aspectos técnicos como legales y económicos. <br>
      - Crear un grupo de interés interesado en promover el conocimiento libre y la publicación abierta en la Universidad. <br>
      - Fomentar el conocimiento de las opciones de publicación abierta y conocimiento libre en la Universidad, y en la sociedad en que está inscrita.
    image     : /local/images/revistas.png

  - id        : culturaLibre
    title     : Cultura libre
    content   : >
      Cultura libre es aquella en la que el autor nos ha dado permiso de copia, modificación y redistribución, según la definición más aceptada de obras culturales libres. <br><br>
      Creemos que la comunidad universitaria puede beneficiarse en muchos casos tanto del uso de obras culturales libres, como de la difusión de sus propias obras según estos principios. Siguiendo esta idea, trataremos de ayudar a todas las personas interesadas, y a las instituciones de la propia Universidad, a comprender mejor la cultura libre, y a ser partícipe de ella en la medida que se alinea con nuestros valores y objetivos. <br><br>
      Los principales objetivos en este ámbito son:
      - Promover el conocimiento y el acercamiento a las obras culturales libre por parte de la comunidad universitaria. <br>
      - Fomentar la producción de obras culturales libres por parte de la comunidad universitaria. <br>
      - Fomento de la creación de un grupo de creadores interesados en la producción de obras culturales libres. <br>
    image     : /local/images/cc_by-sa_3.0.png

  - id        : datosAbiertos
    title     : Datos abiertos
    content   : >
      Los datos abiertos son aquellos que se publican de forma que puedan ser reutilizados por terceros de la forma más fácil y práctica posible. La Open Knowledge Foundation proporciona una definición más detallada en su Open Data Handbook. <br><br>
      En la OfiLibre creemos que los datos abiertos contribuyen a mejorar la reproducibilidad y verificación de los resultados de investigación, la transparencia de las instituciones, y proporcionan oportunidades de que terceros puedan explotarlos de formas que no les ocurrió a sus productores.Y pensamos que la comunidad universitaria puede beneficiarse de todo esto, tanto como productora como consumidora de datos abiertos. <br><br>
      Los principales objetivos que nos planteamos en este ámbito son:
      - Fomentar el conocimiento y uso de datos abiertos como forma de compartir conocimiento, mejorar la eficacia y favorecer la toma decisiones, la transparencia y la rendición de cuentas. <br>
      - Estimular la publicación de datos abiertos en los ámbitos de Universidad donde esto sea posible y conveniente,y especialmente en lo referente a los datos de investigación. <br>
      - Apoyar las iniciativas existentes y promover nuevas relacionadas con la publicación de datos abiertos. <br>
      - Fomentar de la creación de un grupo de personas de la comunidad universitaria interesadas en los datos abiertos. <br>
    image     : /local/images/openaccess-square.png

  - id        : softwareLibre
    title     : Software libre
    content   : >
      El software es libre cuando sus autores nos han dado permiso de copia,modificación y redistribución. Hay dos definiciones clásicas,que detallan las condiciones que ha de cumplir un programa para ser considerado software libre: Free Software Definition y Open Source Definition. <br><br>
      En la OfiLibre pensamos que el software libre es una opción muy interesante en muchos casos, que en la actualidad tiene un enorme uso en la industria, y que puede traer muchos beneficios a la comunidad universitaria. Por ello nos proponemos explicar cómo cualquiera puede utilizarlo con ventaja en muchas situaciones, y cómo distribuir como software libre el que realizamos puede ser una opción muy interesante. <br><br>
      Objetivos principales en este ámbito:
      - Fomentar el uso del software libre en los distintos ámbitos de la Universidad, y del conocimiento de las opciones disponibles. <br>
      - Promover el conocimiento de las implicaciones del software libre como usuarios (técnicas, sobre todo en ciertos ámbitos, legales, económicas, sociales). <br>
      - Propiciar la liberación de software producto de actividades docentes e investigadoras de la Universidad. <br>
      - Impulsar la creación de un grupo de personas interesadas en el fomento del software libre. <br>
      - Explicar las opciones, implicaciones sociales, etc.del uso y la producción de software libre. <br>
    image     : /local/images/blog/software-libre/logo.png

