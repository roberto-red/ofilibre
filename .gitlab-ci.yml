#default:
#  image: "${CI_TEMPLATE_REGISTRY_HOST}/pages/hugo/hugo_extended:latest"

image:
  name: "${CI_TEMPLATE_REGISTRY_HOST}/pages/hugo/hugo_extended:latest"
  entrypoint: [""]

variables:
  GIT_SUBMODULE_STRATEGY: recursive

test:  # builds and tests your site
  script:
    - hugo
  rules:
    - if: $CI_COMMIT_BRANCH != $CI_DEFAULT_BRANCH

pages:  # a predefined job that builds your pages and saves them to the specified path.
  script:
    # $CI_PAGES_URL es la URL real de GitLab Pages de este proyecto.
    # Así el preview funciona sin tocar el baseURL de producción del config.toml.
    # Para el dominio definitivo (ofilibre.urjc.es), basta con quitar --baseURL
    # y configurar el dominio en Settings > Pages.
    - hugo --buildDrafts --buildFuture --baseURL "$CI_PAGES_URL"
  artifacts:
    paths:
      - public
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  environment: production
