#default:
#  image: "${CI_TEMPLATE_REGISTRY_HOST}/pages/hugo/hugo_extended:latest"

image:
  name: "${CI_TEMPLATE_REGISTRY_HOST}/pages/hugo/hugo_extended:latest"
  entrypoint: [""]

variables:
  GIT_SUBMODULE_STRATEGY: recursive

test:  # builds and tests your site
  script:
    - hugo
  rules:
    - if: $CI_COMMIT_BRANCH != $CI_DEFAULT_BRANCH

pages:  # a predefined job that builds your pages and saves them to the specified path.
  script:
    # baseURL propio de GitLab Pages: sin esto los assets/enlaces apuntarían al
    # baseURL de config.toml (ofilibre.urjc.es, la producción en Netlify) y la web
    # servida en ofilibre.gitlab.io cargaría CSS/JS cross-domain y se vería rota.
    - hugo --buildDrafts --buildFuture --baseURL "$CI_PAGES_URL"
  artifacts:
    paths:
      - public
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  environment: production
