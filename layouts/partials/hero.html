{{ if .Site.Params.hero.enable }}
{{ "<!-- Hero Area -->" | safeHTML }}
<section class="hero-area">
    <div class="container">
        <div class="row align-items-center">
            <div class="col-md-6">
                <iframe src='https://tv.urjc.es/iframe/5d022dedd68b14cb308b6ae5' 
                    id='pumukitiframe' frameborder='0' border='0' width='100%' height='332px' allowfullscreen>
                </iframe>
            </div>
            <div class="col-md-6">
                <div class="block hero-content {{ if not .IsHome }}no-button{{ end }}">
                    <div class="hero-text-wrapper">
                        {{ with .Site.Params.hero.heading }}
                            <h2>{{ . }}</h2>
                        {{ end }}
                        {{ with .Site.Params.hero.description }}
                            <p>{{ . }}</p>
                        {{ end }}
                    </div>
                    {{ if and .Site.Params.hero.button .IsHome }}
                        <div class="hero-button-wrapper">
                            <ul class="list-inline wow fadeInUp" data-wow-duration=".5s" data-wow-delay=".7s">
                                <li class="list-inline-item">
                                    <a href="{{ with .Site.Params.hero.btnURL }}{{.}}{{ end }}" class="btn btn-main">{{ with .Site.Params.hero.btnText }}{{.}}{{ end }}</a>
                                </li>
                            </ul>
                        </div>
                    {{ end }}
                </div>
            </div>
        </div>
    </div>
</section>
{{ end }}
